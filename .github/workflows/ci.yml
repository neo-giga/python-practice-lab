name: CI

on:
  pull_request:
  push:
    branches: [dev, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests and real-Pyodide corpus
        run: npm test
      - uses: astral-sh/setup-uv@v6
      - name: Portability (native CPython 3.11)
        run: npm run test:portability
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E (real browsers, real Pyodide, production build at /python-practice-lab/)
        run: npm run test:e2e
      - name: Cheatsheet is up to date
        run: npm run cheatsheet && git diff --exit-code docs/CHEATSHEET.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: test-results/
          retention-days: 14
